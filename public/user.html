<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{{name}} | Safari Office</title>
<script src="/socket.io/socket.io.js"></script>
<link rel="stylesheet" href="/theme.css">

<style>
* { box-sizing: border-box; }

body {
  margin:0;
  font-family:-apple-system, BlinkMacSystemFont, "Segoe UI";
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:40px 20px 60px;
  position:relative;
}

.topbar {
  position:absolute;
  top:15px;
  right:20px;
  z-index:5;
}

/* ===== Profile card ===== */

.profile-card {
  width:100%;
  max-width:560px;
  background:var(--panel);
  border-radius:24px;
  overflow:hidden;
  box-shadow:0 20px 60px rgba(0,0,0,0.25);
}

.profile-banner {
  height:104px;
  background:
    radial-gradient(120% 140% at 15% 0%, rgba(255,255,255,0.18), transparent 60%),
    linear-gradient(120deg, var(--accent), #8a5aff 55%, #ff6fae 120%);
  position:relative;
}

.profile-body {
  padding:0 32px 28px;
  text-align:center;
  margin-top:-44px;
}

.avatar-wrap {
  position:relative;
  width:92px;
  height:92px;
  margin:0 auto 14px;
}

.avatar {
  width:92px;
  height:92px;
  border-radius:50%;
  object-fit:cover;
  background:linear-gradient(135deg, var(--accent), #8a5aff);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:34px;
  font-weight:700;
  color:#fff;
  border:4px solid var(--panel);
  box-shadow:0 4px 16px rgba(0,0,0,0.25);
}

.avatar-edit-btn {
  position:absolute;
  bottom:0px;
  right:0px;
  width:30px;
  height:30px;
  border-radius:50%;
  border:none;
  background:var(--card);
  color:var(--text);
  cursor:pointer;
  font-size:14px;
  box-shadow:0 2px 8px rgba(0,0,0,0.4);
  display:none; /* shown only for the owner */
}

.avatar-edit-btn:hover { background:var(--border); }

.name { font-size:23px; font-weight:700; margin-bottom:2px; letter-spacing:-0.2px; }
.username { color:var(--muted); margin-bottom:14px; font-size:14px; }

.badge-row {
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:20px;
}

.badge {
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:6px 13px;
  border-radius:999px;
  font-size:12.5px;
  font-weight:600;
}

.badge .dot {
  width:7px;
  height:7px;
  border-radius:50%;
}

.badge-status { background:#1e3a1e; color:#7be07b; }
.badge-status .dot { background:#7be07b; }

.badge-team { background:var(--card); color:var(--text); }
.badge-team .dot { background:var(--accent); }

.badge-role {
  color:#fff;
}

.actions {
  display:flex;
  gap:10px;
}

button {
  flex:1;
  padding:12px;
  border:none;
  border-radius:12px;
  font-weight:600;
  cursor:pointer;
  font-size:14.5px;
  font-family:inherit;
  transition:filter 0.15s, opacity 0.15s;
}

button:hover { filter:brightness(1.08); }

.btn-primary {
  background:var(--accent);
  color:#fff;
}

.btn-secondary {
  background:var(--card);
  color:var(--text);
}

/* ===== Tabs ===== */

.tabs {
  width:100%;
  max-width:560px;
  display:flex;
  gap:6px;
  margin-top:18px;
  background:var(--panel);
  border-radius:16px;
  padding:5px;
}

.tab-btn {
  flex:1;
  background:none;
  border:none;
  padding:11px 10px;
  border-radius:12px;
  font-weight:600;
  font-size:13.5px;
  color:var(--muted);
  cursor:pointer;
  font-family:inherit;
}

.tab-btn:hover { filter:none; background:var(--card); }
.tab-btn.active { background:var(--accent); color:#fff; }

.tab-panel { width:100%; max-width:560px; }
.tab-panel.hidden { display:none; }

/* ===== Generic panel ===== */

.panel {
  width:100%;
  background:var(--panel);
  border-radius:20px;
  margin-top:14px;
  padding:22px 24px;
}

.panel h3 {
  margin:0 0 4px;
  font-size:16px;
}

.panel .panel-sub {
  color:var(--muted);
  font-size:13px;
  margin-bottom:18px;
}

/* ===== Agent data tab ===== */

.agent-locked-note {
  display:flex;
  align-items:center;
  gap:8px;
  background:var(--card);
  color:var(--muted);
  font-size:12.5px;
  padding:10px 14px;
  border-radius:12px;
  margin-bottom:18px;
}

.field-group {
  background:var(--card);
  border-radius:14px;
  padding:16px 18px;
  margin-bottom:14px;
}

.field-group-title {
  font-size:12.5px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:0.04em;
  color:var(--muted);
  margin-bottom:12px;
  display:flex;
  align-items:center;
  gap:7px;
}

.field-group-title .brand-dot {
  width:8px;
  height:8px;
  border-radius:50%;
}

.field-row {
  display:flex;
  flex-direction:column;
  gap:6px;
  margin-bottom:12px;
}

.field-row:last-child { margin-bottom:0; }

.field-label {
  font-size:12px;
  color:var(--muted);
}

.field-value-row {
  display:flex;
  align-items:center;
  gap:8px;
}

.field-display {
  flex:1;
  min-width:0;
  background:var(--input);
  border-radius:10px;
  padding:10px 12px;
  font-size:14px;
  font-weight:500;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.field-display.empty { color:var(--muted); font-weight:400; font-style:italic; }

.field-input {
  flex:1;
  width:100%;
  background:var(--input);
  border:1px solid transparent;
  border-radius:10px;
  padding:10px 12px;
  font-size:14px;
  font-weight:500;
  color:var(--text);
  outline:none;
  font-family:inherit;
}

.field-input:focus { border-color:var(--accent); }

.icon-action-btn {
  flex:none;
  width:36px;
  height:36px;
  padding:0;
  border-radius:9px;
  background:var(--input);
  color:var(--text);
  font-size:14px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.icon-action-btn:hover { background:var(--border); }

.agent-data-actions {
  display:flex;
  gap:10px;
  margin-top:18px;
}

.save-feedback {
  font-size:13px;
  margin-top:10px;
  text-align:center;
  min-height:18px;
}

.save-feedback.ok { color:#7be07b; }
.save-feedback.err { color:#ff7b7b; }

.no-access-box {
  text-align:center;
  color:var(--muted);
  padding:30px 10px;
  font-size:14px;
}

/* ===== Mini chat ===== */

.mini-chat {
  width:100%;
}

.mini-chat h3 { margin-top:0; }

.mini-messages {
  max-height:280px;
  overflow:auto;
  margin-bottom:10px;
  display:flex;
  flex-direction:column;
}

.mini-input-row {
  display:flex;
  align-items:center;
  gap:8px;
}

.mini-input {
  flex:1;
  width:100%;
  padding:10px;
  border-radius:10px;
  border:none;
  background:var(--card);
  color:var(--text);
  outline:none;
  font-family:inherit;
}
</style>
</head>

<body>

<div class="topbar" id="prefsWidget"></div>

<div class="profile-card">
  <div class="profile-banner"></div>
  <div class="profile-body">
    <div class="avatar-wrap">
      <div class="avatar" id="avatarEl">{{name}}</div>
      <button class="avatar-edit-btn" id="avatarEditBtn" title="Change photo" data-i18n-title="changePhoto">✎</button>
      <input type="file" id="avatarInput" accept=".jpg,.jpeg,.png,.gif,.webp" style="display:none;">
    </div>
    <div class="name">{{name}}</div>
    <div class="username">@{{username}}</div>

    <div class="badge-row">
      <span class="badge badge-status"><span class="dot"></span> <span data-i18n="online">Online</span></span>
      <span class="badge badge-team"><span class="dot"></span> {{team}}</span>
      <span class="badge badge-role" id="roleBadge">{{role}}</span>
    </div>

    <div class="actions">
      <button class="btn-primary" id="messageBtn" onclick="goToDmWithProfile()" data-i18n="startChat" style="display:none;">Message</button>
      <button class="btn-primary" id="dashboardBtn" onclick="if(document.referrer && document.referrer !== window.location.href){ history.back(); } else { window.location.href='/dashboard.html'; }" data-i18n="goToDashboard">Go to dashboard</button>
      <button class="btn-secondary" onclick="logout()" data-i18n="logout">Logout</button>
    </div>
  </div>
</div>

<div class="tabs">
  <button class="tab-btn active" id="tabBtnOverview" data-i18n="tabOverview">Overview</button>
  <button class="tab-btn" id="tabBtnAgentData" data-i18n="tabAgentData">Agent Data</button>
</div>

<!-- ===== Overview tab ===== -->
<div class="tab-panel" id="tabOverview">
  <div class="panel mini-chat">
    <h3>💬 <span data-i18n="teamChatTitle">Team Chat</span> ({{team}})</h3>
    <div class="mini-messages" id="miniMessages"></div>
    <div class="mini-input-row" id="miniInputRow">
      <input class="mini-input" id="miniMsg" data-i18n-placeholder="writeMessage" placeholder="Write message..." />
      <button class="emoji-btn" id="miniEmojiBtn" title="Emoji">😊</button>
    </div>
  </div>
</div>

<!-- ===== Agent Data tab ===== -->
<div class="tab-panel hidden" id="tabAgentData">
  <div class="panel" id="agentDataPanel">
    <h3 data-i18n="tabAgentData">Agent Data</h3>
    <div class="panel-sub" data-i18n="agentDataIntro">Mail and Zoho credentials used for this agent.</div>
    <div id="agentDataContent">
      <!-- filled by JS -->
    </div>
  </div>
</div>

<script src="/shared.js"></script>
<script>
renderSafariPrefsWidget(document.getElementById("prefsWidget"));
SafariPrefs.init();

const socket = io();
const team = "{{team}}";
const displayName = "{{name}}";
const profileUsername = "{{username}}";
const rawRole = "{{role}}";
let avatarUrl = "__AVATAR_JSON__";
let viewerUsername = null;
let viewerName = null;
let viewerIsAdmin = false;

function escapeHtml(str) {
  return String(str ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;");
}

/* ===== Role badge color coding ===== */

const ROLE_COLORS = {
  admin:         "linear-gradient(135deg,#ff5f6d,#ffc371)",
  hos:           "linear-gradient(135deg,#8a5aff,#5a5aff)",
  tl_sales:      "linear-gradient(135deg,#36d1c4,#1e90ff)",
  tl_retention:  "linear-gradient(135deg,#36d1c4,#1e90ff)",
  sales:         "linear-gradient(135deg,#5a5aff,#8a5aff)",
  retention:     "linear-gradient(135deg,#5a5aff,#8a5aff)"
};

function applyRoleBadge() {
  const el = document.getElementById("roleBadge");
  el.style.background = ROLE_COLORS[rawRole] || "linear-gradient(135deg, var(--accent), #8a5aff)";
}
applyRoleBadge();

function renderAvatar() {
  const el = document.getElementById("avatarEl");
  if (avatarUrl) {
    el.outerHTML = `<img class="avatar" id="avatarEl" src="${avatarUrl}" alt="${escapeHtml(displayName)}">`;
  } else {
    el.outerHTML = `<div class="avatar" id="avatarEl">${escapeHtml(displayName.trim().charAt(0).toUpperCase() || "?")}</div>`;
  }
}

renderAvatar();

/* ===== Tabs ===== */

const tabBtnOverview = document.getElementById("tabBtnOverview");
const tabBtnAgentData = document.getElementById("tabBtnAgentData");
const tabOverviewPanel = document.getElementById("tabOverview");
const tabAgentDataPanel = document.getElementById("tabAgentData");

function showTab(name) {
  const isOverview = name === "overview";
  tabBtnOverview.classList.toggle("active", isOverview);
  tabBtnAgentData.classList.toggle("active", !isOverview);
  tabOverviewPanel.classList.toggle("hidden", !isOverview);
  tabAgentDataPanel.classList.toggle("hidden", isOverview);

  if (!isOverview && !agentDataLoaded) {
    loadAgentData();
  }
}

tabBtnOverview.addEventListener("click", () => showTab("overview"));
tabBtnAgentData.addEventListener("click", () => showTab("agentData"));

// Deep-link support: /u/username#agent-data
if (window.location.hash === "#agent-data") {
  showTab("agentData");
}

// Only the profile owner can change the photo from here.
// Visitors (anyone else) instead get a "Message" button to start a DM.
(async () => {
  try {
    const res = await fetch("/me");
    if (res.ok) {
      const me = await res.json();
      viewerUsername = me.username;
      viewerName = me.name || me.username;
      viewerIsAdmin = me.role === "admin";

      if (viewerUsername === profileUsername) {
        document.getElementById("avatarEditBtn").style.display = "flex";
        document.getElementById("avatarEditBtn").style.alignItems = "center";
        document.getElementById("avatarEditBtn").style.justifyContent = "center";
      } else {
        document.getElementById("messageBtn").style.display = "block";

        // Visiting a colleague's page: the team chat below is theirs, so
        // only let you read it. Composing is only for actual teammates.
        if (me.team !== team) {
          document.getElementById("miniInputRow").style.display = "none";
        }
      }

      // Agent Data tab is only relevant if the viewer can actually see it
      // (the profile owner, or an admin). Hide the tab entirely otherwise.
      if (viewerUsername !== profileUsername && !viewerIsAdmin) {
        tabBtnAgentData.style.display = "none";
      }
    }
  } catch (e) {
    // not logged in; page itself is already access-controlled server-side
  }
})();

function goToDmWithProfile() {
  window.location.href = `/dashboard.html?dm=${encodeURIComponent(profileUsername)}`;
}

const avatarInput = document.getElementById("avatarInput");
document.getElementById("avatarEditBtn").addEventListener("click", () => avatarInput.click());

avatarInput.addEventListener("change", async () => {
  const file = avatarInput.files[0];
  if (!file) return;

  try {
    const formData = new FormData();
    formData.append("avatar", file);

    const res = await fetch("/api/avatar", { method: "POST", body: formData });
    const data = await res.json();

    if (!res.ok) {
      alert(data.error || SafariPrefs.t("uploadFailed"));
      return;
    }

    avatarUrl = data.avatar;
    renderAvatar();
  } catch (e) {
    alert(SafariPrefs.t("uploadFailed"));
  } finally {
    avatarInput.value = "";
  }
});

if (team && team !== "No team") {
  socket.emit("join", team);
  socket.emit("getHistory", team);
}

function formatBubbleTime(timestamp) {
  const d = timestamp ? new Date(timestamp) : new Date();
  return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
}

function renderMiniMsg(m, box) {
  const isOwn = m.user === (viewerName || displayName);
  const prev = box.lastElementChild;
  const isGrouped = prev && prev.classList.contains("bubble-row") &&
    prev.getAttribute("data-user") === m.user;

  const row = document.createElement("div");
  row.className = `bubble-row no-avatar ${isOwn ? "own" : "other"}${isGrouped ? " grouped" : ""}`;
  row.setAttribute("data-user", m.user);

  const col = document.createElement("div");
  col.className = "bubble-col";

  let authorHtml = "";
  if (!isOwn && !isGrouped) {
    authorHtml = `<div class="bubble-author">${escapeHtml(m.user)}</div>`;
  }

  const bubble = document.createElement("div");
  bubble.className = "bubble";

  let innerHtml = "";
  if (m.text) innerHtml += `<span class="bubble-text">${escapeHtml(m.text)}</span>`;

  if (m.attachment && m.attachment.url) {
    innerHtml += `<a href="${m.attachment.url}" target="_blank" class="bubble-file">📎 ${escapeHtml(m.attachment.name)}</a>`;
  }

  innerHtml += `<span class="bubble-meta">${formatBubbleTime(m.timestamp)}</span>`;
  bubble.innerHTML = innerHtml;

  col.innerHTML = authorHtml;
  col.appendChild(bubble);

  row.appendChild(col);
  box.appendChild(row);
}

socket.on("history", (msgs) => {
  const box = document.getElementById("miniMessages");
  box.innerHTML = "";
  msgs.slice(-20).forEach(m => renderMiniMsg(m, box));
  box.scrollTop = box.scrollHeight;
});

if ("Notification" in window && Notification.permission === "default") {
  Notification.requestPermission();
}

socket.on("msg", (msg) => {
  const box = document.getElementById("miniMessages");
  renderMiniMsg(msg, box);
  box.scrollTop = box.scrollHeight;

  if (msg.user !== (viewerName || displayName) && document.hidden && "Notification" in window && Notification.permission === "granted") {
    new Notification(`${msg.user} — ${team}`, { body: msg.text || "📎 " + (msg.attachment ? msg.attachment.name : "Attachment") });
  }
});

attachEmojiPicker(document.getElementById("miniEmojiBtn"), document.getElementById("miniMsg"));

document.getElementById("miniMsg").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && e.target.value.trim() && team && team !== "No team") {
    socket.emit("msg", { room: team, text: e.target.value, user: viewerName || displayName });
    e.target.value = "";
  }
});

async function logout() {
  await fetch("/logout");
  window.location.href = "/login.html";
}

/* =========================
   AGENT DATA TAB
   Persists across logout/login since it lives on the server (users.json),
   not in browser storage — reloading or signing back in always re-fetches
   the latest saved values.
========================= */

let agentDataLoaded = false;
let agentData = null;
let canEditAgentData = false;
let agentDataEditing = false;

const ZOHO_BRANDS = [
  { key: "soltren", labelKey: "zohoBrandSoltren", dotColor: "#5a5aff" },
  { key: "isp", labelKey: "zohoBrandIsp", dotColor: "#ff6fae" }
];

async function loadAgentData() {
  const container = document.getElementById("agentDataContent");
  container.innerHTML = `<div class="no-access-box">${escapeHtml(SafariPrefs.t("loading"))}</div>`;

  try {
    const res = await fetch(`/api/users/${encodeURIComponent(profileUsername)}/agent-data`);
    if (res.status === 403 || res.status === 401) {
      container.innerHTML = `<div class="no-access-box">${escapeHtml(SafariPrefs.t("noAccessAgentData"))}</div>`;
      agentDataLoaded = true;
      return;
    }
    if (!res.ok) throw new Error("Failed to load");

    const payload = await res.json();
    agentData = payload.data;
    canEditAgentData = !!payload.canEdit;
    agentDataLoaded = true;
    renderAgentData();
  } catch (e) {
    container.innerHTML = `<div class="no-access-box">${escapeHtml(SafariPrefs.t("failedToLoad"))}</div>`;
  }
}

function fieldDisplayHtml(value, fieldId, isSecret) {
  const hasValue = !!value;
  const displayText = hasValue
    ? (isSecret ? "••••••••••" : escapeHtml(value))
    : escapeHtml(SafariPrefs.t("notSet"));

  const secretButtons = isSecret && hasValue
    ? `<button type="button" class="icon-action-btn" data-reveal="${fieldId}" title="${escapeHtml(SafariPrefs.t("show"))}">👁</button>`
    : "";

  const copyButton = hasValue
    ? `<button type="button" class="icon-action-btn" data-copy="${fieldId}" title="${escapeHtml(SafariPrefs.t("copy"))}">⧉</button>`
    : "";

  return `
    <div class="field-value-row">
      <div class="field-display ${hasValue ? "" : "empty"}" id="display-${fieldId}" data-real-value="${escapeHtml(value || "")}" data-revealed="false" data-is-secret="${isSecret}">${displayText}</div>
      ${secretButtons}
      ${copyButton}
    </div>
  `;
}

function fieldEditHtml(value, fieldId, isSecret, placeholderKey) {
  const type = isSecret ? "text" : "text"; // plain text inputs; masking handled visually elsewhere
  return `
    <div class="field-value-row">
      <input class="field-input" id="input-${fieldId}" type="${type}" value="${escapeHtml(value || "")}" placeholder="${escapeHtml(SafariPrefs.t(placeholderKey) || "")}">
    </div>
  `;
}

function renderAgentData() {
  const container = document.getElementById("agentDataContent");

  if (!agentData) {
    container.innerHTML = `<div class="no-access-box">${escapeHtml(SafariPrefs.t("failedToLoad"))}</div>`;
    return;
  }

  const lockedNote = !canEditAgentData
    ? `<div class="agent-locked-note">🔒 ${escapeHtml(SafariPrefs.t("agentDataAdminOnly"))}</div>`
    : "";

  const editingNow = agentDataEditing && canEditAgentData;

  let html = lockedNote;

  // Gmail field group
  html += `
    <div class="field-group">
      <div class="field-group-title"><span class="brand-dot" style="background:#ea4335;"></span>${escapeHtml(SafariPrefs.t("gmailAddress"))}</div>
      <div class="field-row">
        ${editingNow
          ? fieldEditHtml(agentData.gmailAddress, "gmail", false, "gmailAddress")
          : fieldDisplayHtml(agentData.gmailAddress, "gmail", false)}
      </div>
    </div>
  `;

  for (const brand of ZOHO_BRANDS) {
    const brandData = agentData.zoho[brand.key] || { mail: "", password: "" };
    html += `
      <div class="field-group">
        <div class="field-group-title"><span class="brand-dot" style="background:${brand.dotColor};"></span>${escapeHtml(SafariPrefs.t(brand.labelKey))}</div>
        <div class="field-row">
          <div class="field-label">${escapeHtml(SafariPrefs.t("zohoMail"))}</div>
          ${editingNow
            ? fieldEditHtml(brandData.mail, `${brand.key}-mail`, false, "zohoMail")
            : fieldDisplayHtml(brandData.mail, `${brand.key}-mail`, false)}
        </div>
        <div class="field-row">
          <div class="field-label">${escapeHtml(SafariPrefs.t("zohoPassword"))}</div>
          ${editingNow
            ? fieldEditHtml(brandData.password, `${brand.key}-password`, true, "zohoPassword")
            : fieldDisplayHtml(brandData.password, `${brand.key}-password`, true)}
        </div>
      </div>
    `;
  }

  if (canEditAgentData) {
    if (editingNow) {
      html += `
        <div class="agent-data-actions">
          <button class="btn-secondary" id="agentDataCancelBtn" data-i18n="cancelEdit">Cancel</button>
          <button class="btn-primary" id="agentDataSaveBtn" data-i18n="saveChanges">Save changes</button>
        </div>
        <div class="save-feedback" id="agentDataFeedback"></div>
      `;
    } else {
      html += `
        <div class="agent-data-actions">
          <button class="btn-primary" id="agentDataEditBtn" data-i18n="editAgentData">Edit</button>
        </div>
        <div class="save-feedback" id="agentDataFeedback"></div>
      `;
    }
  }

  container.innerHTML = html;
  SafariPrefs.applyLang(SafariPrefs.getLang());
  attachAgentDataHandlers(editingNow);
}

function attachAgentDataHandlers(editingNow) {
  document.querySelectorAll("[data-reveal]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const fieldId = btn.getAttribute("data-reveal");
      const display = document.getElementById(`display-${fieldId}`);
      const revealed = display.getAttribute("data-revealed") === "true";
      const realValue = display.getAttribute("data-real-value");

      if (revealed) {
        display.textContent = "••••••••••";
        display.setAttribute("data-revealed", "false");
        btn.title = SafariPrefs.t("show");
        btn.textContent = "👁";
      } else {
        display.textContent = realValue;
        display.setAttribute("data-revealed", "true");
        btn.title = SafariPrefs.t("hide");
        btn.textContent = "🙈";
      }
    });
  });

  document.querySelectorAll("[data-copy]").forEach((btn) => {
    btn.addEventListener("click", async () => {
      const fieldId = btn.getAttribute("data-copy");
      const display = document.getElementById(`display-${fieldId}`);
      const realValue = display.getAttribute("data-real-value");
      if (!realValue) return;

      try {
        await navigator.clipboard.writeText(realValue);
        const original = btn.textContent;
        btn.textContent = "✓";
        setTimeout(() => { btn.textContent = original; }, 1200);
      } catch (e) {
        // clipboard API unavailable; silently ignore
      }
    });
  });

  const editBtn = document.getElementById("agentDataEditBtn");
  if (editBtn) {
    editBtn.addEventListener("click", () => {
      agentDataEditing = true;
      renderAgentData();
    });
  }

  const cancelBtn = document.getElementById("agentDataCancelBtn");
  if (cancelBtn) {
    cancelBtn.addEventListener("click", () => {
      agentDataEditing = false;
      renderAgentData();
    });
  }

  const saveBtn = document.getElementById("agentDataSaveBtn");
  if (saveBtn) {
    saveBtn.addEventListener("click", saveAgentData);
  }
}

async function saveAgentData() {
  const feedback = document.getElementById("agentDataFeedback");
  const saveBtn = document.getElementById("agentDataSaveBtn");

  const payload = {
    gmailAddress: document.getElementById("input-gmail").value.trim(),
    zoho: {
      soltren: {
        mail: document.getElementById("input-soltren-mail").value.trim(),
        password: document.getElementById("input-soltren-password").value
      },
      isp: {
        mail: document.getElementById("input-isp-mail").value.trim(),
        password: document.getElementById("input-isp-password").value
      }
    }
  };

  saveBtn.disabled = true;

  try {
    const res = await fetch(`/api/users/${encodeURIComponent(profileUsername)}/agent-data`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    const data = await res.json();

    if (!res.ok) {
      feedback.textContent = data.error || SafariPrefs.t("saveFailed");
      feedback.className = "save-feedback err";
      saveBtn.disabled = false;
      return;
    }

    agentData = data.data;
    agentDataEditing = false;
    renderAgentData();

    // Re-grab feedback element since renderAgentData rebuilt the DOM.
    const newFeedback = document.getElementById("agentDataFeedback");
    if (newFeedback) {
      newFeedback.textContent = SafariPrefs.t("savedSuccess");
      newFeedback.className = "save-feedback ok";
      setTimeout(() => { newFeedback.textContent = ""; }, 2500);
    }
  } catch (e) {
    feedback.textContent = SafariPrefs.t("saveFailed");
    feedback.className = "save-feedback err";
    saveBtn.disabled = false;
  }
}
</script>
