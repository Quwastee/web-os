<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Safari Office</title>
<link rel="stylesheet" href="/theme.css">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: var(--lo-bg);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
  color: var(--lo-text);
  -webkit-font-smoothing: antialiased;
  transition: background 0.3s;
}

/* ── Canvas sits behind everything ── */
#bgCanvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 0;
}

/* ── Top-right controls ── */
.topbar {
  position: fixed;
  top: 18px;
  right: 20px;
  z-index: 10;
}

/* ── Center stack ── */
.wrapper {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 340px;
  padding: 0 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 28px;
}

/* ── Brand ── */
.brand {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 11px;
  text-align: center;
}

.brand-icon {
  width: 64px;
  height: 64px;
  border-radius: 16px;
  background: var(--lo-icon-bg);
  box-shadow: var(--lo-icon-shadow);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 32px;
}

.brand-title {
  font-size: 22px;
  font-weight: 600;
  letter-spacing: -0.3px;
  color: var(--lo-text);
}

.brand-sub {
  font-size: 14px;
  color: var(--lo-muted);
  margin-top: -5px;
}

/* ── Card ── */
.card {
  width: 100%;
  background: var(--lo-card);
  border-radius: 18px;
  border: var(--lo-card-border);
  box-shadow: var(--lo-card-shadow);
  padding: 24px 22px 22px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* ── Fields ── */
.field { display: flex; flex-direction: column; gap: 5px; }

.field label {
  font-size: 11px;
  font-weight: 500;
  color: var(--lo-muted);
  letter-spacing: 0.4px;
  text-transform: uppercase;
}

.field input {
  width: 100%;
  height: 44px;
  padding: 0 13px;
  border-radius: 10px;
  border: var(--lo-input-border);
  background: var(--lo-input);
  color: var(--lo-text);
  font-size: 15px;
  font-family: inherit;
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
}

.field input::placeholder { color: var(--lo-muted); opacity: 0.45; }

.field input:focus {
  border-color: var(--lo-focus-border);
  box-shadow: 0 0 0 3px var(--lo-focus-ring);
}

/* ── Divider ── */
.divider { height: 1px; background: var(--lo-divider); }

/* ── Remember me ── */
.remember {
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  user-select: none;
  width: fit-content;
}

.remember input[type="checkbox"] {
  appearance: none;
  -webkit-appearance: none;
  width: 16px;
  height: 16px;
  border-radius: 4px;
  border: var(--lo-input-border);
  background: var(--lo-input);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: background 0.15s, border-color 0.15s;
  position: relative;
}

.remember input[type="checkbox"]:checked {
  background: var(--lo-check-bg);
  border-color: var(--lo-check-bg);
}

.remember input[type="checkbox"]:checked::after {
  content: '';
  position: absolute;
  left: 4px;
  top: 1.5px;
  width: 5px;
  height: 9px;
  border: 2px solid var(--lo-check-mark);
  border-top: none;
  border-left: none;
  transform: rotate(45deg);
}

.remember span {
  font-size: 13px;
  color: var(--lo-muted);
}

/* ── Error ── */
.error-box {
  font-size: 13px;
  color: #e05252;
  min-height: 14px;
  text-align: center;
}

/* ── Sign In button ── */
.btn-signin {
  width: 100%;
  height: 44px;
  border-radius: 10px;
  border: none;
  background: var(--lo-btn);
  color: var(--lo-btn-text);
  font-size: 15px;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  letter-spacing: -0.1px;
  transition: opacity 0.15s, transform 0.1s;
}

.btn-signin:hover:not(:disabled) { opacity: 0.88; }
.btn-signin:active:not(:disabled) { transform: scale(0.98); opacity: 0.78; }
.btn-signin:disabled { opacity: 0.4; cursor: default; }

/* ═══════════════════════════════
   DARK (default)
═══════════════════════════════ */
:root, body.dark {
  --lo-bg:           #1c1c1e;
  --lo-card:         rgba(44,44,46,0.96);
  --lo-card-border:  1px solid rgba(255,255,255,0.09);
  --lo-card-shadow:  0 2px 24px rgba(0,0,0,0.5), 0 1px 3px rgba(0,0,0,0.3);
  --lo-text:         #f5f5f7;
  --lo-muted:        #8e8e93;
  --lo-input:        rgba(255,255,255,0.07);
  --lo-input-border: 1px solid rgba(255,255,255,0.12);
  --lo-focus-border: rgba(255,255,255,0.35);
  --lo-focus-ring:   rgba(255,255,255,0.07);
  --lo-btn:          #f5f5f7;
  --lo-btn-text:     #1c1c1e;
  --lo-divider:      rgba(255,255,255,0.08);
  --lo-icon-bg:      rgba(255,255,255,0.08);
  --lo-icon-shadow:  0 2px 14px rgba(0,0,0,0.45);
  --lo-check-bg:     #f5f5f7;
  --lo-check-mark:   #1c1c1e;
  --lo-dot:          rgba(255,255,255,0.18);
  /* shared.js vars */
  --bg:#1c1c1e; --panel:#2c2c2e; --card:rgba(44,44,46,0.96);
  --text:#f5f5f7; --muted:#8e8e93; --input:rgba(255,255,255,0.07);
  --button:#f5f5f7; --buttonText:#1c1c1e; --border:rgba(255,255,255,0.12);
  --accent:#0a84ff;
}

/* ═══════════════════════════════
   LIGHT
═══════════════════════════════ */
body.light {
  --lo-bg:           #f2f2f7;
  --lo-card:         rgba(255,255,255,0.93);
  --lo-card-border:  1px solid rgba(0,0,0,0.08);
  --lo-card-shadow:  0 2px 16px rgba(0,0,0,0.09), 0 1px 3px rgba(0,0,0,0.05);
  --lo-text:         #1c1c1e;
  --lo-muted:        #6e6e73;
  --lo-input:        rgba(0,0,0,0.04);
  --lo-input-border: 1px solid rgba(0,0,0,0.10);
  --lo-focus-border: rgba(0,0,0,0.3);
  --lo-focus-ring:   rgba(0,0,0,0.06);
  --lo-btn:          #1c1c1e;
  --lo-btn-text:     #f5f5f7;
  --lo-divider:      rgba(0,0,0,0.07);
  --lo-icon-bg:      #ffffff;
  --lo-icon-shadow:  0 2px 14px rgba(0,0,0,0.10);
  --lo-check-bg:     #1c1c1e;
  --lo-check-mark:   #ffffff;
  --lo-dot:          rgba(0,0,0,0.12);
  --bg:#f2f2f7; --panel:#fff; --card:rgba(255,255,255,0.93);
  --text:#1c1c1e; --muted:#6e6e73; --input:rgba(0,0,0,0.04);
  --button:#1c1c1e; --buttonText:#f5f5f7; --border:rgba(0,0,0,0.10);
  --accent:#0a84ff;
}

/* ═══════════════════════════════
   GRAY
═══════════════════════════════ */
body.gray {
  --lo-bg:           #242426;
  --lo-card:         rgba(54,54,58,0.96);
  --lo-card-border:  1px solid rgba(255,255,255,0.07);
  --lo-card-shadow:  0 2px 24px rgba(0,0,0,0.55), 0 1px 3px rgba(0,0,0,0.3);
  --lo-text:         #e5e5ea;
  --lo-muted:        #8e8e93;
  --lo-input:        rgba(255,255,255,0.06);
  --lo-input-border: 1px solid rgba(255,255,255,0.10);
  --lo-focus-border: rgba(255,255,255,0.28);
  --lo-focus-ring:   rgba(255,255,255,0.06);
  --lo-btn:          #e5e5ea;
  --lo-btn-text:     #242426;
  --lo-divider:      rgba(255,255,255,0.07);
  --lo-icon-bg:      rgba(255,255,255,0.07);
  --lo-icon-shadow:  0 2px 14px rgba(0,0,0,0.55);
  --lo-check-bg:     #e5e5ea;
  --lo-check-mark:   #242426;
  --lo-dot:          rgba(255,255,255,0.13);
  --bg:#242426; --panel:#36363a; --card:rgba(54,54,58,0.96);
  --text:#e5e5ea; --muted:#8e8e93; --input:rgba(255,255,255,0.06);
  --button:#e5e5ea; --buttonText:#1c1c1e; --border:rgba(255,255,255,0.10);
  --accent:#636366;
}

/* ── prefs widget ── */
.safari-prefs { gap: 8px; }
.safari-prefs .icon-btn {
  width: 34px; height: 34px;
  border-radius: 50%; border: none; cursor: pointer;
  background: var(--lo-card);
  color: var(--lo-text);
  font-size: 15px;
  display: inline-flex; align-items: center; justify-content: center;
  opacity: 1; visibility: visible;
  box-shadow: var(--lo-card-shadow);
  transition: opacity 0.15s;
}
.safari-prefs .icon-btn:hover { opacity: 0.75; }
.safari-prefs .lang-menu { top: 42px; border-radius: 14px; }
</style>
</head>
<body>

<canvas id="bgCanvas"></canvas>

<div class="topbar" id="prefsWidget"></div>

<div class="wrapper">
  <div class="brand">
    <div class="brand-icon">🧭</div>
    <div>
      <div class="brand-title">Safari Office</div>
      <div class="brand-sub" data-i18n="signInSubtitle">Sign in to continue</div>
    </div>
  </div>

  <div class="card">
    <div class="field">
      <label data-i18n="username">Username</label>
      <input id="u" type="text" autocomplete="username" data-i18n-placeholder="username">
    </div>

    <div class="divider"></div>

    <div class="field">
      <label data-i18n="password">Password</label>
      <input id="p" type="password" autocomplete="current-password" data-i18n-placeholder="password">
    </div>

    <label class="remember">
      <input type="checkbox" id="rememberMe">
      <span data-i18n="rememberMe">Remember me</span>
    </label>

    <div class="error-box" id="errorBox"></div>

    <button class="btn-signin" id="loginBtn" onclick="login()" data-i18n="signIn">Sign In</button>
  </div>
</div>

<script src="/shared.js"></script>
<script>
/* Patch i18n for rememberMe key (not in original dict) */
["en","ru","ua","fr","es"].forEach(lang => {
  if (SAFARI_I18N[lang]) SAFARI_I18N[lang].rememberMe =
    { en:"Remember me", ru:"Запомнить меня", ua:"Запам'ятати мене",
      fr:"Se souvenir de moi", es:"Recuérdame" }[lang] || "Remember me";
});

renderSafariPrefsWidget(document.getElementById("prefsWidget"));
SafariPrefs.init();

/* ═══════════════════════════════════════════════════════
   BACKGROUND — floating dots, slow drift, minimal & GPU
═══════════════════════════════════════════════════════ */
(function() {
  const canvas = document.getElementById("bgCanvas");
  const ctx    = canvas.getContext("2d");
  const DPR    = Math.min(devicePixelRatio || 1, 2);
  const N      = 38; /* dot count */

  let W, H, dots = [];

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width  = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width  = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }

  function dotColor() {
    const cls = document.body.className;
    if (cls.includes("light")) return "0,0,0";
    return "255,255,255";
  }

  function makeDot(i) {
    /* Each dot has an x/y position and drifts slowly toward one edge,
       then wraps. Speed is very low — purely ambient. */
    const angle = (Math.random() * 2 * Math.PI); /* random drift direction */
    return {
      x:   Math.random() * W,
      y:   Math.random() * H,
      r:   0.8 + Math.random() * 1.8,          /* radius 0.8–2.6 px */
      vx:  Math.cos(angle) * (0.06 + Math.random() * 0.14),
      vy:  Math.sin(angle) * (0.06 + Math.random() * 0.14),
      op:  0.04 + Math.random() * 0.18,         /* base opacity */
      pop: Math.random() * Math.PI * 2,         /* pulse phase offset */
      pd:  8 + Math.random() * 12,              /* pulse duration (s) */
    };
  }

  function init() {
    resize();
    dots = Array.from({ length: N }, (_, i) => makeDot(i));
  }

  let last = 0, raf, paused = false;
  document.addEventListener("visibilitychange", () => {
    paused = document.hidden;
    if (!paused && !raf) raf = requestAnimationFrame(frame);
  });

  function frame(now) {
    raf = 0;
    if (paused) return;
    const dt = Math.min((now - last) / 1000, 0.05); /* delta in seconds, capped */
    last = now;

    ctx.clearRect(0, 0, W, H);

    const col = dotColor();

    for (let i = 0; i < dots.length; i++) {
      const d = dots[i];

      /* move */
      d.x += d.vx;
      d.y += d.vy;

      /* wrap around edges */
      if (d.x < -10)  d.x = W + 10;
      if (d.x > W+10) d.x = -10;
      if (d.y < -10)  d.y = H + 10;
      if (d.y > H+10) d.y = -10;

      /* gentle opacity pulse */
      const pulse = 0.5 + 0.5 * Math.sin((now / 1000 / d.pd) * Math.PI * 2 + d.pop);
      const alpha = d.op * (0.6 + 0.4 * pulse);

      ctx.beginPath();
      ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${col},${alpha.toFixed(3)})`;
      ctx.fill();
    }

    raf = requestAnimationFrame(frame);
  }

  window.addEventListener("resize", () => { resize(); }, { passive: true });
  init();
  raf = requestAnimationFrame(frame);
})();

/* ═══════════════════════════════════════════════════════
   LOGIN
═══════════════════════════════════════════════════════ */
/* Pre-fill username if remembered */
window.addEventListener("DOMContentLoaded", () => {
  const saved = localStorage.getItem("savedUsername");
  if (saved) {
    document.getElementById("u").value = saved;
    document.getElementById("rememberMe").checked = true;
  }
});

async function login() {
  const username  = document.getElementById("u").value.trim();
  const password  = document.getElementById("p").value;
  const remember  = document.getElementById("rememberMe").checked;
  const btn       = document.getElementById("loginBtn");
  const errorBox  = document.getElementById("errorBox");

  errorBox.innerText = "";

  if (!username || !password) {
    errorBox.innerText = SafariPrefs.t("wrongCredentials");
    return;
  }

  btn.disabled = true;

  /* Save or clear username locally */
  if (remember) {
    localStorage.setItem("savedUsername", username);
  } else {
    localStorage.removeItem("savedUsername");
  }

  try {
    const res  = await fetch("/login", {
      method:  "POST",
      headers: { "Content-Type": "application/json" },
      body:    JSON.stringify({ username, password, remember })
    });
    const data = await res.json();

    if (res.ok && data.ok) {
      window.location.href = data.redirect || "/dashboard.html";
    } else {
      errorBox.innerText = SafariPrefs.t("wrongCredentials");
      btn.disabled = false;
    }
  } catch (e) {
    errorBox.innerText = SafariPrefs.t("wrongCredentials");
    btn.disabled = false;
  }
}

document.getElementById("p").addEventListener("keydown", e => {
  if (e.key === "Enter") login();
});

window.onload = async () => {
  try {
    const res = await fetch("/me");
    if (res.ok) window.location.href = "/dashboard.html";
  } catch (e) {}
};
</script>
</body>
</html>
